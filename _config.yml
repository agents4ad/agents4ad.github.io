title: AD Simulation Workshops
email:
description: >- # this means to ignore newlines until "baseurl:"
  Workshops on Autonomous Driving Simulation
github_username: m-naumann
minimal_mistakes_skin: default
search: false

# Build settings
markdown: kramdown
theme: minimal-mistakes-jekyll

# Sass settings - silence deprecation warnings from theme dependencies
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - slash-div

include:
  - _pages

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# https://github.com/github/pages-gem/issues/399#issuecomment-301827749
github: [metadata]

repository: agents4ad/agents4ad.github.io
